aid: picnicai
name: Picnicai
description: >-
  PicnicHealth (PicnicAI; legally Mission Health Labs, Inc.) is a San Francisco
  health-data company and Y Combinator alum (S14, founded 2014) that turns
  patients' fragmented medical records into structured, research-ready
  real-world datasets. Its consumer product gives patients a unified timeline of
  care across every provider, while PicnicResearch supplies de-identified,
  ontology-mapped (RxNorm, SNOMED, LOINC, ICD) real-world data to biopharma via
  AI extraction plus human clinical curation. The primary developer surface is a
  first-party R package distributed through PicnicHealth's own Posit/RStudio
  Package Manager for importing and visualizing research cohorts.
